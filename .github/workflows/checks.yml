name: Checks

on:
  pull_request:
    paths:
      - '.github/workflows/checks.yml'
      - '__tests__/**'
      - 'src/**'
      - 'dist/**'
      - 'jest.config.ts'
      - 'package-lock.json'

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      checks: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install NPM Dev Dependencies
        run: |
          npm ci

      - name: Lint
        run: npm run lint

      # dist/ is committed and is what `uses:` actually runs, so a stale bundle
      # ships the old behaviour however green src/ is.
      - name: Verify dist is rebuilt from src
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "ERROR: dist/ is stale — run 'npm run build' and commit the result"
            git diff --stat -- dist/
            exit 1
          fi

      - name: Run Tests and Check Coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
