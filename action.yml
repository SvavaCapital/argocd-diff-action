name: 'ArgoCD Diff'
description: 'Diffs all ArgoCD apps in the repo, and provides the diff as a PR comment'
author: 'argocd-diff-action'
inputs:
  only-changed-apps:
    description: Only run diffs for ArgoCD Applications whose spec.source.path contains files changed in the pull request
    default: 'false'
    required: false
  match-env-in-path:
    description: With only-changed-apps, a changed file under <path>/values/<env>/ or <path>/cluster-config/<env>/ only selects Applications whose plugin env ENV is <env> (base/common select all)
    default: 'false'
    required: false
  path-aliases:
    description: With only-changed-apps, comma-separated from=to prefix pairs; an app path starting with `from` also matches changed files under `to` + the rest of the path (e.g. `argocd-nonprod/=` makes argocd-nonprod/charts/x also match charts/x/...)
    default: ''
    required: false
  max-concurrency:
    description: Maximum number of app diffs run at the same time (0 = no limit)
    default: '5'
    required: false
  diff-retries:
    description: Retries per app diff when ArgoCD answers 502/503/504 (a render that outlived a proxy timeout; the server usually finishes and caches it), waiting 10s, 20s, ...
    default: '2'
    required: false
  diff-timeout-seconds:
    description: Kill a single app diff after this many seconds (0 = no timeout)
    default: '90'
    required: false
  argocd-server-fqdn: 
    description: ArgoCD server FQDN (i.e., without the protocol)
    required: true
  argocd-server-tls:
    description: Use TLS to communicate with ArgoCD
    default: 'true'
    required: false
  argocd-token: 
    description: ArgoCD token for a local or project-scoped user https://argoproj.github.io/argo-cd/operator-manual/user-management/#local-usersaccounts-v15
    required: true
  argocd-version: 
    description: '`argocd` command version to install. Defaults to the server version.'
    default: ''
    required: false
  github-token: 
    description: Github Token
    required: true
  argocd-extra-cli-args: 
    description: Extra arguments to pass to the argocd CLI
    default: --grpc-web
    required: false
  argocd-exclude-paths:
    description: ArgoCD app paths to exclude in comma separated list
    default: ''
    required: false
  force-apps:
    description: Comma-separated list of ArgoCD app names to always diff, regardless of changed files (used to force diffs when env-values change)
    default: ''
    required: false
  head-sha:
    description: Override commit SHA for the diff comment header (used when triggering from non-PR events like issue_comment)
    default: ''
    required: false
runs:
  using: 'node20'
  main: 'dist/index.js'
